<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villa Aura — Immersive Architectural Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{overflow:hidden;background:#000;font-family:'Inter',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
        canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%}

        #loader{position:fixed;inset:0;background:#0a0a0c;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 1.2s cubic-bezier(.4,0,.2,1)}
        #loader.done{opacity:0;pointer-events:none}
        .ld-brand{font-family:'Cormorant Garamond',serif;font-size:clamp(1.4rem,3vw,2.2rem);font-weight:300;letter-spacing:.4em;text-transform:uppercase;color:#c9a96e;margin-bottom:3rem;opacity:0;animation:fadeUp .8s .3s forwards}
        .ld-bar-wrap{width:min(320px,70vw);height:1px;background:rgba(255,255,255,.08);position:relative;opacity:0;animation:fadeUp .8s .5s forwards}
        .ld-bar{height:100%;background:linear-gradient(90deg,#c9a96e,#e8d5a3);width:0%;transition:width .3s ease}
        .ld-pct{margin-top:1.2rem;font-size:.7rem;letter-spacing:.3em;color:rgba(255,255,255,.3);opacity:0;animation:fadeUp .8s .6s forwards}
        .ld-tagline{margin-top:2.5rem;font-family:'Cormorant Garamond',serif;font-size:.85rem;font-weight:300;font-style:italic;color:rgba(201,169,110,.5);letter-spacing:.15em;opacity:0;animation:fadeUp .8s .8s forwards}
        @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

        #startOverlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:8000;opacity:0;pointer-events:none;transition:opacity .8s;background:radial-gradient(ellipse at center,rgba(10,10,12,.7) 0%,rgba(10,10,12,.95) 100%)}
        #startOverlay.show{opacity:1;pointer-events:all}
        #startOverlay h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,5vw,3.5rem);font-weight:300;letter-spacing:.25em;text-transform:uppercase;color:#c9a96e;margin-bottom:.5rem}
        #startOverlay p{font-size:.8rem;letter-spacing:.2em;color:rgba(255,255,255,.4);margin-bottom:3rem}
        #startBtn{padding:14px 48px;border:1px solid rgba(201,169,110,.4);background:transparent;color:#c9a96e;font-family:'Inter',sans-serif;font-size:.7rem;letter-spacing:.35em;text-transform:uppercase;cursor:pointer;transition:all .5s cubic-bezier(.4,0,.2,1)}
        #startBtn:hover{background:rgba(201,169,110,.1);border-color:#c9a96e;box-shadow:0 0 40px rgba(201,169,110,.1)}

        #ui{position:fixed;inset:0;z-index:100;pointer-events:none;opacity:0;transition:opacity .5s}
        #ui.active{opacity:1}
        #ui *{pointer-events:auto}

        #roomLabel{position:absolute;top:32px;left:50%;transform:translateX(-50%);text-align:center;transition:opacity .5s}
        #roomLabel h2{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:300;letter-spacing:.25em;text-transform:uppercase;color:rgba(255,255,255,.85)}
        #roomLabel span{font-size:.6rem;letter-spacing:.3em;color:rgba(201,169,110,.6);text-transform:uppercase}

        #navBar{position:absolute;bottom:0;left:0;right:0;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to top,rgba(0,0,0,.6) 0%,transparent 100%);transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .5s}
        #navBar.hidden{transform:translateY(100%);opacity:0}
        .nb-group{display:flex;align-items:center;gap:8px}
        .nb-btn{width:40px;height:40px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;font-size:.8rem;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
        .nb-btn:hover{border-color:rgba(201,169,110,.5);color:#c9a96e;background:rgba(201,169,110,.08)}
        .nb-btn.active{border-color:#c9a96e;color:#c9a96e}
        .nb-sep{width:1px;height:24px;background:rgba(255,255,255,.08);margin:0 6px}
        .nb-label{font-size:.6rem;letter-spacing:.2em;color:rgba(255,255,255,.3);text-transform:uppercase;margin-right:8px}

        .nb-pill{padding:8px 16px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:rgba(255,255,255,.5);font-size:.65rem;letter-spacing:.15em;cursor:pointer;transition:all .3s;text-transform:uppercase;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
        .nb-pill:hover{border-color:rgba(201,169,110,.4);color:#c9a96e}
        .nb-pill.active{border-color:#c9a96e;color:#c9a96e;background:rgba(201,169,110,.1)}

        #miniMap{position:absolute;bottom:80px;left:32px;width:140px;height:100px;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:8px;opacity:0;transition:opacity .4s}
        #miniMap.show{opacity:1}
        #miniMap svg{width:100%;height:100%}

        #infoCard{position:absolute;top:50%;right:32px;transform:translateY(-50%) translateX(20px);width:300px;background:rgba(10,10,12,.85);border:1px solid rgba(201,169,110,.15);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:28px;opacity:0;pointer-events:none;transition:all .5s cubic-bezier(.4,0,.2,1)}
        #infoCard.show{opacity:1;pointer-events:all;transform:translateY(-50%) translateX(0)}
        #infoCard h3{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:400;letter-spacing:.15em;color:#c9a96e;margin-bottom:12px}
        #infoCard p{font-size:.75rem;line-height:1.8;color:rgba(255,255,255,.5);margin-bottom:8px}
        #infoCard .tag{display:inline-block;padding:4px 10px;border:1px solid rgba(201,169,110,.2);font-size:.55rem;letter-spacing:.15em;color:rgba(201,169,110,.7);margin:3px 3px 0 0;text-transform:uppercase}
        #infoCard .close-card{position:absolute;top:12px;right:12px;width:28px;height:28px;border:1px solid rgba(255,255,255,.1);background:none;color:rgba(255,255,255,.4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.9rem;transition:all .3s}
        #infoCard .close-card:hover{border-color:#c9a96e;color:#c9a96e}

        #tourOverlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:120px;z-index:200;pointer-events:none;opacity:0;transition:opacity .8s}
        #tourOverlay.show{opacity:1}
        #tourOverlay .tour-text{text-align:center;max-width:500px}
        #tourOverlay .tour-title{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:300;letter-spacing:.2em;color:#c9a96e;margin-bottom:8px}
        #tourOverlay .tour-desc{font-size:.72rem;line-height:1.9;color:rgba(255,255,255,.45);letter-spacing:.05em}

        #crosshair{position:fixed;top:50%;left:50%;width:6px;height:6px;border:1px solid rgba(255,255,255,.15);border-radius:50%;transform:translate(-50%,-50%);z-index:50;pointer-events:none;opacity:0;transition:opacity .3s}
        #crosshair.show{opacity:1}

        #weatherFx{position:fixed;inset:0;pointer-events:none;z-index:40}
        .rain-drop{position:absolute;width:1px;background:linear-gradient(to bottom,transparent,rgba(180,200,220,.4));animation:rainFall linear infinite}
        @keyframes rainFall{0%{transform:translateY(-10vh)}100%{transform:translateY(110vh)}}
    </style>
  <script type="module" crossorigin src="/assets/index-DU6_jv-v.js"></script>
</head>
<body>
    <canvas id="c"></canvas>

    <div id="loader">
        <div class="ld-brand">Villa Aura</div>
        <div class="ld-bar-wrap"><div class="ld-bar" id="ldBar"></div></div>
        <div class="ld-pct" id="ldPct">0%</div>
        <div class="ld-tagline">An Immersive Architectural Experience</div>
    </div>

    <div id="startOverlay">
        <h1>Villa Aura</h1>
        <p>Contemporary Luxury Living</p>
        <button id="startBtn">Enter Experience</button>
    </div>

    <div id="ui">
        <div id="roomLabel">
            <span id="roomSubtitle">EXTERIOR</span>
            <h2 id="roomName">Villa Aura</h2>
        </div>

        <div id="miniMap">
            <svg viewBox="0 0 140 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="20" y="10" width="100" height="70" stroke="rgba(201,169,110,.3)" stroke-width=".5" fill="rgba(201,169,110,.03)"/>
                <rect x="25" y="15" width="30" height="25" stroke="rgba(255,255,255,.15)" stroke-width=".3" fill="rgba(255,255,255,.02)"/>
                <rect x="60" y="15" width="35" height="25" stroke="rgba(255,255,255,.15)" stroke-width=".3" fill="rgba(255,255,255,.02)"/>
                <rect x="25" y="45" width="55" height="30" stroke="rgba(255,255,255,.15)" stroke-width=".3" fill="rgba(255,255,255,.02)"/>
                <rect x="85" y="45" width="30" height="30" stroke="rgba(255,255,255,.15)" stroke-width=".3" fill="rgba(255,255,255,.02)"/>
                <rect x="30" y="85" width="60" height="12" rx="1" stroke="rgba(100,160,220,.4)" stroke-width=".3" fill="rgba(100,160,220,.08)"/>
                <circle id="mapDot" cx="70" cy="50" r="2" fill="#c9a96e"/>
            </svg>
        </div>

        <div id="infoCard">
            <button class="close-card">&times;</button>
            <h3 id="cardTitle"></h3>
            <p id="cardDesc"></p>
            <div id="cardTags"></div>
        </div>

        <div id="tourOverlay">
            <div class="tour-text">
                <div class="tour-title" id="tourTitle"></div>
                <div class="tour-desc" id="tourDesc"></div>
            </div>
        </div>

        <div id="navBar" class="hidden">
            <div class="nb-group">
                <button class="nb-btn" id="btnPrev" title="Previous Room">&#9664;</button>
                <button class="nb-btn" id="btnNext" title="Next Room">&#9654;</button>
                <div class="nb-sep"></div>
                <button class="nb-btn" id="btnExt" title="Exterior View">&#9673;</button>
                <button class="nb-btn" id="btnTour" title="Cinematic Tour">&#9655;</button>
                <div class="nb-sep"></div>
                <span class="nb-label" style="font-size:.5rem;color:rgba(255,255,255,.25)">WASD: Move &middot; Mouse: Look &middot; Scroll: Zoom</span>
            </div>
            <div class="nb-group">
                <span class="nb-label">Time</span>
                <button class="nb-pill active" data-time="golden">Golden</button>
                <button class="nb-pill" data-time="sunset">Sunset</button>
                <button class="nb-pill" data-time="night">Night</button>
                <div class="nb-sep"></div>
                <span class="nb-label">Weather</span>
                <button class="nb-pill active" data-weather="clear">Clear</button>
                <button class="nb-pill" data-weather="rain">Rain</button>
                <button class="nb-pill" data-weather="storm">Storm</button>
                <div class="nb-sep"></div>
                <button class="nb-btn" id="btnInfo" title="Information">&#9432;</button>
                <button class="nb-btn" id="btnFS" title="Fullscreen">&#9974;</button>
            </div>
        </div>
    </div>

    <div id="crosshair"></div>
    <div id="weatherFx"></div>

</body>
</html>
